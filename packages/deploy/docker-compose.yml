version: '3.8'

services:
  # AGI-OS API Server
  agi-api:
    build:
      context: ../..
      dockerfile: packages/deploy/Dockerfile
    container_name: agi-os-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MAX_SPEND=0
      - OLLAMA_URL=http://ollama:11434
      - DATABASE_PATH=/app/.agi-os/data/agi_os.db
    volumes:
      - agi-data:/app/.agi-os/data
    networks:
      - agi-network
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Ollama Local LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: agi-os-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - agi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL (Optional - for advanced persistence)
  postgres:
    image: postgres:16-alpine
    container_name: agi-os-postgres
    environment:
      - POSTGRES_DB=agi_os
      - POSTGRES_USER=agi
      - POSTGRES_PASSWORD=agi_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agi -d agi_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: agi-os-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - agi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agi-data:
    driver: local
  ollama-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  agi-network:
    driver: bridge
    name: agi-os-network
