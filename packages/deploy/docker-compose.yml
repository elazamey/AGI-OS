version: '3.8'

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: agios-gateway
    ports:
      - "7860:7860"
    environment:
      - NODE_ENV=production
      - PORT=7860
      - MAX_SPEND=0
      - SANDBOX_TIMEOUT_SECONDS=30
      - MAX_SELF_HEALING_RETRIES=3
      - ALLOWED_EXECUTABLES=python,python3,pytest,npm,npx,node
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7860/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - agios-network

  redis:
    image: redis:7-alpine
    container_name: agios-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - agios-network

  nginx:
    image: nginx:alpine
    container_name: agios-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agios-network

volumes:
  redis-data:

networks:
  agios-network:
    driver: bridge
